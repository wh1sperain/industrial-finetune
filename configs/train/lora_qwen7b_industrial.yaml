# SFT LoRA 训练配置（Qwen2.5-7B + Mining-Engineering）
# 用法：bash scripts/train.sh configs/train/lora_qwen7b_industrial.yaml [--resume]
# 模型路径/输出目录/实验名统一在 configs/models.yaml

### 数据
dataset: acnul/Mining-Engineering-SFT   # 字段：prompt/response/source
dataset_revision: main
max_train_samples: null     # 冒烟调试设 512；正式训练留 null（全量 5,287 条）
max_length: 2048            # TRL 1.x 字段名（旧版 max_seq_length）

### LoRA / QLoRA
qlora: false                # true = 4bit NF4 量化
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

### 训练（5090 优化）
per_device_train_batch_size: 4      # 32GB 显存；小卡改回 2
gradient_accumulation_steps: 4      # 全局 batch = 4 × 4 = 16
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_steps: 30            # TRL 1.x 字段名（旧版 warmup_ratio）
num_train_epochs: 3.0
weight_decay: 0.01
bf16: true
gradient_checkpointing: true
logging_steps: 10
save_steps: 500
save_total_limit: 2
seed: 42

### 加速开关
torch_compile: true             # PyTorch 2.7+，首次运行编译预热 1-2 分钟
attn_implementation: sdpa       # Blackwell (sm_120) 不兼容 flash_attention_2
optim: adamw_torch_fused
dataloader_num_workers: 4

### 输出与追踪
report_to: wandb            # 无 wandb 环境可改 none
