# Eight-hour pilot: see docs/synselect_8h.md. Server training only.
stage: grpo
model: Qwen/Qwen2.5-VL-7B-Instruct
sft_adapter: output/synselect/sft_8h
output_dir: output/synselect/grpo_8h
run_name: synselect_grpo_8h
model_options:
  attn_implementation: sdpa
  trust_remote_code: false
processor:
  min_pixels: 50176
  max_pixels: 200704
prompt:
  template: 问：{prompt}
  system: Reason about the image and question. Put your reasoning in <think>...</think> and your final
    answer in <answer>...</answer>.
dataset:
  format: clevr
  annotations: ${CLEVR_ROOT}/questions/CLEVR_train_questions.json
  image_root: ${CLEVR_ROOT}/images/train
  count_only: false
  max_samples: 256
  seed: 42
  sampling:
    strategy: clevr_task_depth
    allocation: balanced
    depth_bins:
    - 6
    - 10
    balance_answers: true
    max_per_image: 1
    require_count: true
train:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  generation_batch_size: 4
  num_generations: 4
  num_iterations: 1
  max_completion_length: 512
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  generation_kwargs:
    do_sample: true
    use_cache: true
  use_vllm: false
  loss_type: grpo
  scale_rewards: group
  beta: 0.04
  epsilon: 0.2
  reward_weights:
  - 1.0
  - 1.0
  mask_truncated_completions: false
  learning_rate: 1.0e-06
  num_train_epochs: 1.0
  max_steps: -1
  lr_scheduler_type: constant
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  optim: adamw_torch_fused
  remove_unused_columns: false
  dataloader_num_workers: 0
  logging_steps: 1
  save_steps: 64
  save_total_limit: 2
  report_to: none
  torch_compile: false
  seed: 42
runtime:
  max_sequence_tokens: 4096
  benchmark_warmup_steps: 2
  expected_torch: 2.12.1
  expected_cuda: '13.0'
  expected_gpu: RTX 5090
  max_wall_seconds: 12600
  save_reserve_seconds: 180
  step_time_safety_factor: 1.5
eval:
  dataset:
    format: clevr
    annotations: ${CLEVR_ROOT}/questions/CLEVR_val_questions.json
    image_root: ${CLEVR_ROOT}/images/val
    max_samples: 64
    seed: 20260907
    sampling:
      strategy: clevr_task_depth
      allocation: balanced
      depth_bins:
      - 6
      - 10
      balance_answers: true
      max_per_image: 1
      require_count: true
  do_sample: false
  max_new_tokens: 512
  max_wall_seconds: 1200
  save_reserve_seconds: 30
estimate:
  sample_counts:
  - 256
  average_completion_tokens: 256
  aggregate_generation_tokens_per_second:
  - 60
  - 180
  update_seconds_per_completion:
  - 0.5
  - 2.0
  overhead_fraction: 0.15
