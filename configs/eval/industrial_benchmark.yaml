# 评测配置
# 用法：bash scripts/eval.sh [--probe] [--baseline] [--semantic] [--review N]
# 模型路径/adapter 目录统一在 configs/models.yaml

name: mining-engineering-eval

eval_dataset: acnul/Mining-Engineering-Eval
eval_dataset_revision: main
probe_dataset: acnul/Mining-Engineering-Probe

max_new_tokens: 256
batch_size: 8

# L2 语义指标（--semantic 时使用，本地 embedding 模型路径）
semantic_model_path: ""
